<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOHR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">
        <img src="images/nohr1.png" alt="NOHR Logo" />
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-title">Welcome Back</div>

        <!---EMAIL--->
        <div class="form-element">
          <label class="form-label" for="email">EMAIL ADDRESS</label>

          <div class="input-container">
            <svg
              class="input-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M3 7l9 6 9-6"></path>
            </svg>
            <input
                type="email"
                id="email"
                placeholder="your@email.com"
                required
                />         
            </div>
        </div>

        <!---PASSWORD--->
        <div class="form-element">
          <div class="password-field">
            <label class="form-label" for="password">PASSWORD</label>
            <a class="password-link" href="#">Forgot Password?</a>
          </div>
          <div class="input-container">
            <svg
              class="input-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>

            <input type="password" id="password" placeholder="••••••••" required/>
            <button class="input-toggle" type="button" aria-label="Show password">

              <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
                <path
                  d="M1.8 12S5.8 5.5 12 5.5 22.2 12 22.2 12 18.2 18.5 12 18.5 1.8 12 1.8 12Z"
                ></path>
                <circle cx="12" cy="12" r="3.2"></circle>
              </svg>
            </button>
          </div>
        </div>

        
        <button type="submit" class="login-button">LOGIN</button>
      </form>
    </div>

    
    
    <script src="script.js"></script>
  </body>
</html>
